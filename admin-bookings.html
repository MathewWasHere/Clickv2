<body dir="rtl" lang="fa"><link rel="preconnect" href="https://unpkg.com" />
<style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" />
<style type="text/tailwindcss">
@theme {
  --color-primary: #151618;
  --color-primary-dark: #0E0F10;
  --color-accent: #62676B;
  --color-surface: #FFFFFF;
  --color-surface-light: #DDE1E4;
  --color-surface-lighter: #C9CFD3;
  --color-base: #CED3D6;
}
</style>
<style>* { font-family: 'Vazirmatn', sans-serif; } body { background: #CED3D6; margin: 0; }</style>

<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="admin-dashboard.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4 text-[#151618]/60"></i></a>
      <h1 class="text-[#151618] font-bold text-lg">مدیریت رزروها</h1>
    </div>
    <div class="flex items-center gap-2">
      <button class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="filter" class="w-4 h-4 text-[#151618]/40"></i></button>
      <button class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="search" class="w-4 h-4 text-[#151618]/40"></i></button>
    </div>
  </div>
</header>


<!-- Status Filter -->
<div class="max-w-md mx-auto px-4 flex gap-2 mb-4 overflow-x-auto" style="scrollbar-width:none;">
  <button data-filter="all" class="shrink-0 bg-[#151618]/5 text-[#151618] text-[10px] font-medium px-3 py-1.5 rounded-lg border border-[#151618]/10">همه</button>
  <button data-filter="confirmed" class="shrink-0 text-green-400 bg-green-500/5 text-[10px] font-medium px-3 py-1.5 rounded-lg">تأیید شده</button>
  <button data-filter="pending" class="shrink-0 text-yellow-400 bg-yellow-500/5 text-[10px] font-medium px-3 py-1.5 rounded-lg">در انتظار</button>
  <button data-filter="cancelled" class="shrink-0 text-red-400 bg-red-500/5 text-[10px] font-medium px-3 py-1.5 rounded-lg">لغو شده</button>
</div>

<div id="adminList" class="max-w-md mx-auto px-4 space-y-2 mb-28"></div>
</div>

<!-- Bottom island navbar -->
<nav class="bottom-nav fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
  <div class="island max-w-md mx-auto flex items-center justify-around py-2 pointer-events-auto">
    <a href="admin-dashboard.html" class=" flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span class="text-[10px] font-medium">داشبورد</span></a>
    <a href="admin-services.html" class=" flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="scissors" class="w-5 h-5"></i><span class="text-[10px] font-medium">خدمات</span></a>
    <a href="admin-bookings.html" class="active flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[10px] font-medium">رزروها</span></a>
    <a href="admin-settings.html" class=" flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="settings" class="w-5 h-5"></i><span class="text-[10px] font-medium">تنظیمات</span></a>
  </div>
</nav>
</body>
<script src="assets/data.js"></script>
<script src="assets/page-admin-bookings.js"></script>
