<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
</head>

<body dir="rtl" lang="fa"><link rel="preconnect" href="https://unpkg.com" />
<style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>

<link rel="stylesheet" href="https://fonts.googleapis.cn/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" />
<style type="text/tailwindcss">
@theme {
  --color-primary: #272727;
  --color-primary-dark: #1a1a1a;
  --color-accent: #7A1F2D;
  --color-surface: #FFFFFF;
  --color-surface-light: #F0EFE9;
  --color-surface-lighter: #E8E7E1;
  --color-base: #F9F8F2;
}
</style>
<style>* { font-family: 'Vazirmatn', sans-serif; } body { background: #F9F8F2; margin: 0; }</style>

<header class="sticky top-0 z-40 bg-base/90 backdrop-blur-xl border-b border-[#272727]/5">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="home.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4 text-[#272727]/60"></i></a>
      <h1 class="text-[#272727] font-bold text-lg">رزروهای من</h1>
    </div>
    <a href="booking.html" class="bg-primary/10 text-primary text-xs font-semibold px-4 py-2 rounded-xl">+ رزرو جدید</a>
  </div>
</header>

<!-- Tabs -->
<div class="max-w-md mx-auto px-4 mt-4 flex gap-2 mb-4">
  <button class="flex-1 bg-primary text-[#F9F8F2] text-xs font-semibold py-2.5 rounded-xl">پیش‌رو</button>
  <button class="flex-1 bg-surface-light text-[#272727]/50 text-xs font-medium py-2.5 rounded-xl">گذشته</button>
</div>

<div class="max-w-md mx-auto px-4 space-y-3 mb-8">
  <!-- Upcoming Booking 1 -->
  <div class="bg-surface rounded-2xl border border-primary/15 p-4">
    <div class="flex items-center justify-between mb-3">
      <span class="bg-green-500/10 text-green-400 text-[10px] font-semibold px-2.5 py-1 rounded-lg">تأیید شده</span>
      <span class="text-[#272727]/30 text-[10px]" dir="ltr">BK-۰۷۸</span>
    </div>
    <h3 class="text-[#272727] font-bold text-sm mb-1">پکیج ۳: داماد</h3>
    <div class="flex items-center gap-4 text-xs text-[#272727]/40 mb-3">
      <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> شنبه، ۳۰ تیر ۱۴۰۴</span>
      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ۱۱:۰۰</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-primary font-bold text-sm">۹٬۵۰۰٬۰۰۰ تومان</span>
      <div class="flex gap-2">
        <button class="bg-surface-light text-[#272727]/50 text-[10px] px-3 py-1.5 rounded-lg">لغو</button>
        <button class="bg-primary/10 text-primary text-[10px] font-semibold px-3 py-1.5 rounded-lg">جزئیات</button>
      </div>
    </div>
  </div>

  <!-- Upcoming Booking 2 -->
  <div class="bg-surface rounded-2xl border border-[#272727]/5 p-4">
    <div class="flex items-center justify-between mb-3">
      <span class="bg-yellow-500/10 text-yellow-400 text-[10px] font-semibold px-2.5 py-1 rounded-lg">در انتظار پرداخت</span>
      <span class="text-[#272727]/30 text-[10px]" dir="ltr">BK-۰۷۹</span>
    </div>
    <h3 class="text-[#272727] font-bold text-sm mb-1">اصلاح VIP</h3>
    <div class="flex items-center gap-4 text-xs text-[#272727]/40 mb-3">
      <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> یکشنبه، ۳۱ تیر ۱۴۰۴</span>
      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ۱۴:۰۰</span>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-primary font-bold text-sm">۳۵۰٬۰۰۰ تومان</span>
      <a href="payment.html" class="bg-primary text-[#F9F8F2] text-[10px] font-bold px-4 py-1.5 rounded-lg">پرداخت</a>
    </div>
  </div>

  <!-- Past Booking (dimmed) -->
  <div class="bg-surface rounded-2xl border border-[#272727]/5 p-4 opacity-60">
    <div class="flex items-center justify-between mb-3">
      <span class="bg-[#272727]/5 text-[#272727]/40 text-[10px] font-medium px-2.5 py-1 rounded-lg">انجام شده</span>
      <span class="text-[#272727]/20 text-[10px]" dir="ltr">BK-۰۶۵</span>
    </div>
    <h3 class="text-[#272727] font-bold text-sm mb-1">پاکسازی و فیشیال</h3>
    <div class="flex items-center gap-4 text-xs text-[#272727]/30 mb-3">
      <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> پنجشنبه، ۲۱ تیر ۱۴۰۴</span>
      <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ۱۰:۰۰</span>
    </div>
    <span class="text-[#272727]/30 text-sm">۴۵۰٬۰۰۰ تومان</span>
  </div>
</div>

</body>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
