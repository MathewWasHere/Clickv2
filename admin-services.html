<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://unpkg.com" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>
  <link rel="stylesheet" href="assets/dark.css" />
</head>

<body dir="rtl" lang="fa"><link rel="preconnect" href="https://unpkg.com" />
<style>
    * {
      scrollbar-width: none;
      scrollbar-color: rgba(0, 0, 0, 0.2) transparent;
    }
  </style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" />
<style type="text/tailwindcss">
@theme {
  --color-primary: #272727;
  --color-primary-dark: #1a1a1a;
  --color-accent: #7A1F2D;
  --color-surface: #FFFFFF;
  --color-surface-light: #F0EFE9;
  --color-surface-lighter: #E8E7E1;
  --color-base: #F9F8F2;
}
</style>
<style>
* { font-family: 'Vazirmatn', sans-serif; } body { background: #F9F8F2; margin: 0; }
.modal-overlay { position: fixed; inset: 0; background: rgba(39,39,39,0.5); z-index: 50; display: flex; align-items: flex-end; }
.modal-content { background: #FFFFFF; border-radius: 1.5rem 1.5rem 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.5rem; }
</style>

<header class="sticky top-0 z-40 bg-base/90 backdrop-blur-xl border-b border-[#272727]/5">
  <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="admin-dashboard.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4 text-[#272727]/60"></i></a>
      <h1 class="text-[#272727] font-bold text-lg">مدیریت خدمات</h1>
    </div>
    <button onclick="document.getElementById('addModal').style.display='flex'" class="bg-primary text-[#F9F8F2] text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-1">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i> افزودن
    </button>
  </div>
</header>

<!-- Admin Nav -->
<div class="max-w-md mx-auto px-4 mt-3 flex gap-2 overflow-x-auto mb-5" style="scrollbar-width:none;">
  <a href="admin-dashboard.html" class="shrink-0 bg-surface-light text-[#272727]/50 text-xs font-medium px-4 py-2 rounded-full">داشبورد</a>
  <a href="admin-services.html" class="shrink-0 bg-primary text-[#F9F8F2] text-xs font-semibold px-4 py-2 rounded-full">خدمات</a>
  <a href="admin-bookings.html" class="shrink-0 bg-surface-light text-[#272727]/50 text-xs font-medium px-4 py-2 rounded-full">رزروها</a>
  <a href="admin-settings.html" class="shrink-0 bg-surface-light text-[#272727]/50 text-xs font-medium px-4 py-2 rounded-full">تنظیمات</a>
</div>

<div class="max-w-md mx-auto px-4">
  <!-- Category: Main -->
  <div class="flex items-center gap-2 mb-3">
    <div class="w-1 h-5 bg-primary rounded-full"></div>
    <h2 class="text-[#272727]/70 text-sm font-semibold">خدمات اصلی</h2>
    <span id="countMain" class="text-[#272727]/20 text-[10px]"></span>
  </div>

  <div id="adminMainList" class="space-y-2 mb-6"></div>

  <!-- Category: Groom -->
  <div class="flex items-center gap-2 mb-3">
    <div class="w-1 h-5 bg-primary rounded-full"></div>
    <h2 class="text-[#272727]/70 text-sm font-semibold">پکیج‌های داماد</h2>
    <span id="countGroom" class="text-[#272727]/20 text-[10px]"></span>
  </div>

  <div id="adminGroomList" class="space-y-2 mb-8"></div>
</div>

<!-- Add/Edit Service Modal -->
<div id="addModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-content">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-[#272727] font-bold text-base">افزودن خدمت جدید</h2>
      <button onclick="document.getElementById('addModal').style.display='none'" class="w-8 h-8 rounded-full bg-surface-light flex items-center justify-center"><i data-lucide="x" class="w-4 h-4 text-[#272727]/40"></i></button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-[#272727]/50 text-xs mb-1.5 block">نام خدمت</label>
        <input id="svcName" type="text" placeholder="مثلاً: اصلاح کلاسیک" class="w-full bg-base border border-[#272727]/10 rounded-xl px-4 py-3 text-[#272727] text-sm outline-none focus:border-primary" />
      </div>
      <div>
        <label class="text-[#272727]/50 text-xs mb-1.5 block">دسته‌بندی</label>
        <select id="svcCat" class="w-full bg-base border border-[#272727]/10 rounded-xl px-4 py-3 text-[#272727] text-sm outline-none focus:border-primary">
          <option value="main">خدمات اصلی</option>
          <option value="groom">پکیج‌های داماد</option>
        </select>
      </div>
      <div>
        <label class="text-[#272727]/50 text-xs mb-1.5 block">توضیحات</label>
        <textarea id="svcDesc" rows="3" placeholder="توضیح کوتاه درباره خدمت..." class="w-full bg-base border border-[#272727]/10 rounded-xl px-4 py-3 text-[#272727] text-sm outline-none focus:border-primary resize-none"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[#272727]/50 text-xs mb-1.5 block">قیمت (تومان)</label>
          <input id="svcPrice" type="text" placeholder="۰" class="w-full bg-base border border-[#272727]/10 rounded-xl px-4 py-3 text-[#272727] text-sm outline-none focus:border-primary" />
        </div>
        <div>
          <label class="text-[#272727]/50 text-xs mb-1.5 block">مدت زمان (دقیقه)</label>
          <input id="svcMinutes" type="text" placeholder="۰" class="w-full bg-base border border-[#272727]/10 rounded-xl px-4 py-3 text-[#272727] text-sm outline-none focus:border-primary" />
        </div>
      </div>
      <div class="flex items-center justify-between bg-base rounded-xl p-3 border border-[#272727]/10">
        <span class="text-[#272727] text-sm">فعال</span>
        <div class="w-11 h-6 bg-primary rounded-full relative cursor-pointer">
          <div class="absolute top-0.5 right-0.5 w-5 h-5 bg-white rounded-full shadow"></div>
        </div>
      </div>
      <button id="svcSave" class="w-full bg-gradient-to-l from-primary to-primary-dark text-[#F9F8F2] font-bold py-3.5 rounded-xl mt-2">ذخیره خدمت</button>
    </div>
  </div>
</div>

</body>
<script src="assets/data.js"></script>
<script src="assets/page-admin-services.js"></script>
<script src="assets/theme.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
