<style type="text/tailwindcss">
@theme {
  --color-primary: #111111;
  --color-primary-dark: #000000;
  --color-accent: #6B7280;
  --color-surface: #FFFFFF;
  --color-surface-light: #F3F4F6;
  --color-surface-lighter: #E5E7EB;
  --color-base: #ECEEF0;
  --color-on-primary: #FFFFFF;
  --color-zarinpal: #FFC107;
  --color-zarinpal-dark: #E6AC00;
}
</style>
<style>
* { font-family: 'Vazirmatn', sans-serif; }
body { background: #ECEEF0; margin: 0; }
</style>




<!-- Header -->
<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <a href="booking.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center">
      <i data-lucide="arrow-right" class="w-4 h-4 text-[#111111]/60"></i>
    </a>
    <h1 class="text-[#111111] font-bold text-lg">پرداخت</h1>
  </div>
</header>

<div class="max-w-md mx-auto px-4 mt-6">

  <!-- Order Summary -->
  <div class="bg-surface rounded-2xl border border-[#111111]/5 p-4 mb-4">
    <h2 class="text-[#111111] font-bold text-sm mb-3">خلاصه سفارش</h2>
    <div class="space-y-2 text-xs">
      <div class="flex justify-between items-center"><span class="text-[#111111]/40 text-xs">خدمت</span><span id="payService" class="text-[#111111] font-semibold text-sm">—</span></div>
      <div class="flex justify-between items-center py-1"><span class="text-[#111111]/40 text-xs">تاریخ</span><span id="payDate" class="text-[#111111] font-extrabold text-base">—</span></div>
      <div class="flex justify-between items-center"><span class="text-[#111111]/40 text-xs">ساعت</span><span id="payTime" class="text-[#111111] font-semibold text-sm">—</span></div>
      <div class="border-t border-[#111111]/5 pt-2 mt-2 flex justify-between">
        <span class="text-[#111111] font-semibold">مبلغ کل</span>
        <span id="payTotal" class="text-primary font-bold text-lg">—</span>
      </div>
    </div>
  </div>

  <!-- ZarinPal Gateway Button -->
  <div class="pay-card bg-white rounded-2xl border border-[#111111]/5 p-5 mb-4 text-center">
    <!-- ZarinPal brand -->
    <div class="flex items-center justify-center gap-3 mb-5">
      <img src="assets/zarinpal-logo.svg" alt="زرین‌پال" class="w-12 h-12" />
      <div class="text-right">
        <p class="text-[#111111] font-bold text-base leading-tight">درگاه پرداخت زرین‌پال</p>
        <p class="text-[#111111]/50 text-[11px]">پرداخت امن اینترنتی</p>
      </div>
    </div>

    <!-- Amount highlight -->
    <div class="bg-[#111111]/[0.04] rounded-xl py-3 px-4 mb-5">
      <p class="text-[#111111]/50 text-[11px] mb-1">مبلغ قابل پرداخت</p>
      <p id="payAmount" class="text-[#111111] font-black text-2xl">—</p>
    </div>

    <button id="payBtn" class="group w-full bg-primary hover:bg-primary-dark active:opacity-90 active:scale-[0.98] transition-all duration-200 text-on-primary font-bold py-4 rounded-xl flex items-center justify-center gap-3">
      <span class="text-base">انتقال به درگاه</span>
      <span class="w-px h-5 bg-white/25"></span>
      <span class="flex items-center gap-2 bg-white rounded-lg px-2.5 py-1.5">
        <img src="assets/zarinpal-logo.svg" alt="" class="w-5 h-5" />
        <span class="text-[#111111] font-extrabold tracking-tight text-sm">زرین‌پال</span>
      </span>
      <i data-lucide="arrow-left" class="w-4 h-4 mr-1 opacity-70"></i>
    </button>

    <a id="cancelPay" href="booking.html" class="block w-full text-[#111111]/50 hover:text-red-500 text-xs font-medium text-center py-3 mt-2 transition-colors">انصراف و بازگشت</a>
  </div>

  <!-- Payment Failure State (hidden, for design reference) -->
  <div class="bg-surface rounded-2xl border border-red-500/20 p-6 text-center mb-4" style="display:none;" id="failState">
    <div class="w-16 h-16 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4">
      <i data-lucide="x-circle" class="w-8 h-8 text-red-500"></i>
    </div>
    <h3 class="text-[#111111] font-bold text-lg mb-2">پرداخت ناموفق</h3>
    <p class="text-[#111111]/50 text-xs mb-4">متأسفانه پرداخت شما با خطا مواجه شد. لطفاً دوباره تلاش کنید.</p>
    <button class="bg-primary text-[#FFFFFF] font-bold px-6 py-3 rounded-xl w-full mb-2">تلاش مجدد</button>
    <button class="text-[#111111]/40 text-xs py-2">بازگشت به صفحه رزرو</button>
  </div>

  <!-- Security Notice -->
  <div class="flex items-center justify-center gap-2 text-[#111111]/20 text-[10px] mb-8">
    <i data-lucide="lock" class="w-3 h-3"></i>
    <span>پرداخت امن با رمزنگاری SSL</span>
  </div>
</div>



</body>
