<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101315">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  <!-- Pre-paint theme bootstrap: sets the stored mode before the first frame.
       Keep inline and in sync with assets/theme.js (KEY = 'pirayesh-theme'). -->
  <script>(function(d){var m;try{m=localStorage.getItem('pirayesh-theme')}catch(e){}d.documentElement.setAttribute('data-theme',m==='light'?'light':'dark')})(document)</script>
  <link rel="stylesheet" href="assets/theme.css">
  <style type="text/tailwindcss">
/* Semantic roles -> Tailwind utilities. Every value is a CSS variable defined in
   assets/theme.css, so each utility flips with the mode on its own.
   NOTE: no --color-base here on purpose -- it collided with Tailwind's own
   `text-base` font-size utility and made text vanish in dark mode. */
@theme inline {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-surface-3: var(--surface-3);
  --color-fg: var(--fg);
  --color-muted: var(--muted);
  --color-faint: var(--faint);
  --color-line: var(--line);
  --color-line-strong: var(--line-strong);
  --color-primary: var(--primary);
  --color-primary-dark: var(--primary-dark);
  --color-primary-tint: var(--primary-tint);
  --color-on-primary: var(--on-primary);
  --color-veil: var(--veil);
  --color-veil-2: var(--veil-2);
  --color-on-veil: var(--on-veil);
  --color-on-veil-accent: var(--on-veil-accent);
  --color-accent: var(--accent);
  --color-ok: var(--ok);
  --color-warn: var(--warn);
  --color-err: var(--err);
  --color-info: var(--info);
  --color-violet: var(--violet);
  --font-family-vazir: 'Vazirmatn', sans-serif;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body dir="rtl" lang="fa">

<!-- Header -->
<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <a href="booking.html" class="icon-btn w-9 h-9 flex items-center justify-center">
      <i data-lucide="arrow-right" class="w-4 h-4 text-fg/75"></i>
    </a>
    <h1 class="text-fg font-bold text-lg">پرداخت</h1>
  </div>
</header>

<div class="max-w-md mx-auto px-4 mt-6">

  <!-- Order Summary -->
  <div class="bg-surface rounded-2xl border border-line p-4 mb-4 elev">
    <h2 class="text-fg font-bold text-sm mb-3">خلاصه سفارش</h2>
    <div class="space-y-2 text-xs">
      <div class="flex justify-between"><span class="text-muted">خدمت</span><span id="payService" class="text-fg">—</span></div>
      <div class="flex justify-between"><span class="text-muted">تاریخ</span><span id="payDate" class="text-fg">—</span></div>
      <div class="flex justify-between"><span class="text-muted">ساعت</span><span id="payTime" class="text-fg">—</span></div>
      <div class="border-t border-line pt-2 mt-2 flex justify-between">
        <span class="text-fg font-semibold">مبلغ کل</span>
        <span id="payTotal" class="text-primary font-bold text-lg">—</span>
      </div>
    </div>
  </div>

  <!-- ZarinPal Mock Gateway — pinned to the light palette with data-theme so a
       bank-form look stays familiar (and legible) in dark mode too. -->
  <div data-theme="light" class="theme-light-zone bg-surface rounded-2xl overflow-hidden mb-4">
    <!-- ZarinPal Header -->
    <div class="bg-gradient-to-l from-veil-2 to-veil px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-on-veil/15 flex items-center justify-center">
          <span class="text-on-veil font-bold text-sm">Z</span>
        </div>
        <div>
          <p class="text-on-veil font-bold text-sm">درگاه پرداخت زرین‌پال</p>
          <p class="text-on-veil/75 text-[10px]">پرداخت امن اینترنتی</p>
        </div>
      </div>
      <i data-lucide="shield-check" class="w-5 h-5 text-on-veil/75"></i>
    </div>
    
    <!-- Payment Details -->
    <div class="p-4">
      <div class="bg-surface-2 rounded-xl p-3 mb-4">
        <div class="flex justify-between text-xs mb-2">
          <span class="text-faint">فروشگاه</span>
          <span class="text-fg font-semibold">پیرایش — آرایشگاه مردانه</span>
        </div>
        <div class="flex justify-between text-xs mb-2">
          <span class="text-faint">شماره سفارش</span>
          <span id="payOrder" class="text-fg font-semibold" dir="ltr">—</span>
        </div>
        <div class="flex justify-between text-xs">
          <span class="text-faint">مبلغ</span>
          <span id="payAmount" class="text-fg font-bold text-base">—</span>
        </div>
      </div>
      
      <!-- Card Input (Mock) -->
      <div class="mb-3">
        <label class="text-muted text-xs mb-1.5 block">شماره کارت</label>
        <div class="flex gap-2" dir="ltr">
          <input type="text" value="6037" class="flex-1 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm text-fg font-mono" readonly />
          <input type="text" value="99••" class="flex-1 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm text-fg font-mono" readonly />
          <input type="text" value="••••" class="flex-1 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm text-fg font-mono" readonly />
          <input type="text" value="1234" class="flex-1 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm text-fg font-mono" readonly />
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="text-muted text-xs mb-1.5 block">رمز دوم</label>
          <input type="password" value="••••••" class="w-full bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm" readonly />
        </div>
        <div>
          <label class="text-muted text-xs mb-1.5 block">CVV2</label>
          <input type="text" value="•••" class="w-full bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm font-mono" readonly />
        </div>
      </div>
      
      <div class="mb-4">
        <label class="text-muted text-xs mb-1.5 block">تاریخ انقضا</label>
        <div class="flex gap-2 items-center" dir="ltr">
          <input type="text" value="۰۵" class="w-16 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm" readonly />
          <span class="text-faint">/</span>
          <input type="text" value="۰۸" class="w-16 bg-surface-2 border border-line-strong rounded-lg text-center py-2.5 text-sm" readonly />
        </div>
      </div>
      
      <button id="payBtn" class="block w-full bg-gradient-to-l from-veil-2 to-veil text-on-veil font-bold text-center py-3.5 rounded-xl elev-cta">پرداخت</button>
      
      <a id="cancelPay" href="booking.html" class="block w-full text-err text-xs font-medium text-center py-3 mt-2">انصراف از پرداخت</a>
    </div>
  </div>

  <!-- Payment Failure State (hidden, for design reference) -->
  <div class="bg-surface rounded-2xl border border-err/30 p-6 text-center mb-4" style="display:none;" id="failState">
    <div class="w-16 h-16 rounded-full bg-err/10 flex items-center justify-center mx-auto mb-4">
      <i data-lucide="x-circle" class="w-8 h-8 text-err"></i>
    </div>
    <h3 class="text-fg font-bold text-lg mb-2">پرداخت ناموفق</h3>
    <p class="text-muted text-xs mb-4">متأسفانه پرداخت شما با خطا مواجه شد. لطفاً دوباره تلاش کنید.</p>
    <button class="bg-primary text-on-primary font-bold px-6 py-3 rounded-xl w-full mb-2">تلاش مجدد</button>
    <button class="text-muted text-xs py-2">بازگشت به صفحه رزرو</button>
  </div>

  <!-- Security Notice -->
  <div class="flex items-center justify-center gap-2 text-faint text-[10px] mb-8">
    <i data-lucide="lock" class="w-3 h-3"></i>
    <span>پرداخت امن با رمزنگاری SSL</span>
  </div>
</div>

</body>
<script src="assets/data.js"></script>
<script src="assets/page-payment.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/pwa.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
