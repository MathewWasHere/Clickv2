<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101315">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  <!-- Pre-paint theme bootstrap: sets the stored mode before the first frame.
       Keep inline and in sync with assets/theme.js (KEY = 'pirayesh-theme'). -->
  <script>(function(d){var m;try{m=localStorage.getItem('pirayesh-theme')}catch(e){}d.documentElement.setAttribute('data-theme',m==='light'?'light':'dark')})(document)</script>
  <link rel="stylesheet" href="assets/theme.css">
  <style type="text/tailwindcss">
/* Semantic roles -> Tailwind utilities. Every value is a CSS variable defined in
   assets/theme.css, so each utility flips with the mode on its own.
   NOTE: no --color-base here on purpose -- it collided with Tailwind's own
   `text-base` font-size utility and made text vanish in dark mode. */
@theme inline {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-surface-3: var(--surface-3);
  --color-fg: var(--fg);
  --color-muted: var(--muted);
  --color-faint: var(--faint);
  --color-line: var(--line);
  --color-line-strong: var(--line-strong);
  --color-primary: var(--primary);
  --color-primary-dark: var(--primary-dark);
  --color-primary-tint: var(--primary-tint);
  --color-on-primary: var(--on-primary);
  --color-veil: var(--veil);
  --color-veil-2: var(--veil-2);
  --color-on-veil: var(--on-veil);
  --color-on-veil-accent: var(--on-veil-accent);
  --color-accent: var(--accent);
  --color-ok: var(--ok);
  --color-warn: var(--warn);
  --color-err: var(--err);
  --color-info: var(--info);
  --color-violet: var(--violet);
  --font-family-vazir: 'Vazirmatn', sans-serif;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body dir="rtl" lang="fa">

<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="home.html" class="icon-btn w-9 h-9 flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4 text-fg/75"></i></a>
      <h1 class="text-fg font-bold text-lg">رزروهای من</h1>
    </div>
  </div>
</header>

<!-- Tabs -->
<div class="max-w-md mx-auto px-4 mt-4 flex gap-2 mb-4">
  <button data-tab="upcoming" aria-pressed="true" class="seg flex-1 text-xs py-2.5 rounded-xl">پیش‌رو</button>
  <button data-tab="past" aria-pressed="false" class="seg flex-1 text-xs py-2.5 rounded-xl">گذشته</button>
</div>

<div id="bookingsList" class="max-w-md mx-auto px-4 space-y-3 mb-28"></div>

<nav class="bottom-nav fixed bottom-4 left-0 right-0 z-50 px-4 pointer-events-none">
  <div class="island max-w-md mx-auto flex items-center justify-around py-2 pointer-events-auto">
    <a href="home.html" class="flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-medium">خانه</span></a>
    <a href="services.html" class="flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="scissors" class="w-5 h-5"></i><span class="text-[10px] font-medium">خدمات</span></a>
    <a href="booking.html" class="flex items-center gap-1.5 h-10 px-4 rounded-full bg-gradient-to-l from-primary to-primary-dark text-on-primary elev-cta" aria-label="رزرو نوبت">
      <i data-lucide="calendar-plus" class="w-5 h-5"></i>
      <span class="text-xs font-bold whitespace-nowrap">رزرو نوبت</span>
    </a>
    <a href="my-bookings.html" class="active flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[10px] font-medium">رزروها</span></a>
    <a href="profile.html" class="flex flex-col items-center gap-1 px-4 py-1.5 rounded-xl"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-medium">پروفایل</span></a>
  </div>
</nav>
</body>
<script src="assets/data.js"></script>
<script src="assets/page-my-bookings.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/pwa.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
