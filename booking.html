<style type="text/tailwindcss">
@theme {
  --color-primary: #272727;
  --color-primary-dark: #1a1a1a;
  --color-accent: #7A1F2D;
  --color-surface: #FFFFFF;
  --color-surface-light: #F0EFE9;
  --color-surface-lighter: #E8E7E1;
  --color-base: #F9F8F2;
}
</style>
<style>
* { font-family: 'Vazirmatn', sans-serif; }
body { background: #F9F8F2; margin: 0; }
.step-active { background: #272727; color: #F9F8F2; }
.step-done { background: #272727; color: #F9F8F2; }
.step-pending { background: #F0EFE9; color: rgba(39,39,39,0.3); }
.time-slot { transition: all 0.15s; }
.time-slot:hover, .time-slot.selected { background: rgba(39,39,39,0.08); border-color: #272727; color: #272727; }
.time-slot.disabled { opacity: 0.3; pointer-events: none; }
.cal-day { transition: all 0.15s; cursor: pointer; }
.cal-day:hover, .cal-day.selected { background: #272727; color: #F9F8F2; }
.cal-day.disabled { opacity: 0.25; pointer-events: none; }
.cal-day.today { border: 1px solid #272727; }
</style>


<style id="dark-mode-styles">
/* Dark mode overrides */
body[data-theme="dark"] { background: #1e1e1e !important; }

/* Theme variable overrides for dark mode */
body[data-theme="dark"] {
  --color-primary: #F9F8F2;
  --color-primary-dark: #E8E7E1;
  --color-base: #1e1e1e;
  --color-surface: #2a2a2a;
  --color-surface-light: #333333;
  --color-surface-lighter: #3d3d3d;
}

/* Hardcoded text color overrides */
body[data-theme="dark"] .text-\[\#272727\] { color: #F9F8F2 !important; }
body[data-theme="dark"] .text-\[\#272727\]\/20 { color: rgba(249,248,242,0.2) !important; }
body[data-theme="dark"] .text-\[\#272727\]\/30 { color: rgba(249,248,242,0.3) !important; }
body[data-theme="dark"] .text-\[\#272727\]\/40 { color: rgba(249,248,242,0.4) !important; }
body[data-theme="dark"] .text-\[\#272727\]\/50 { color: rgba(249,248,242,0.5) !important; }
body[data-theme="dark"] .text-\[\#272727\]\/60 { color: rgba(249,248,242,0.6) !important; }
body[data-theme="dark"] .text-\[\#272727\]\/70 { color: rgba(249,248,242,0.7) !important; }

/* Invert text on primary buttons/badges (was ivory on charcoal, now charcoal on ivory) */
body[data-theme="dark"] .text-\[\#F9F8F2\] { color: #272727 !important; }
body[data-theme="dark"] .text-base { color: #272727 !important; }

/* Background overrides for hardcoded values */
body[data-theme="dark"] .bg-\[\#272727\] { background-color: #F9F8F2 !important; }
body[data-theme="dark"] .bg-\[\#272727\]\/40 { background-color: rgba(249,248,242,0.4) !important; }
body[data-theme="dark"] .bg-\[\#272727\]\/20 { background-color: rgba(249,248,242,0.2) !important; }
body[data-theme="dark"] .bg-\[\#272727\]\/5 { background-color: rgba(249,248,242,0.05) !important; }

/* Border overrides */
body[data-theme="dark"] .border-\[\#272727\]\/5 { border-color: rgba(249,248,242,0.08) !important; }
body[data-theme="dark"] .border-\[\#272727\]\/10 { border-color: rgba(249,248,242,0.1) !important; }
body[data-theme="dark"] .border-\[\#272727\]\/15 { border-color: rgba(249,248,242,0.12) !important; }
body[data-theme="dark"] .border-\[\#272727\]\/20 { border-color: rgba(249,248,242,0.15) !important; }

/* Shadow overrides */
body[data-theme="dark"] .shadow-\[\#272727\]\/20 { --tw-shadow-color: rgba(0,0,0,0.4) !important; }
body[data-theme="dark"] .shadow-\[\#272727\]\/25 { --tw-shadow-color: rgba(0,0,0,0.5) !important; }

/* Body background in plain style */
body[data-theme="dark"] { color: #F9F8F2; }

/* Step classes for booking page */
body[data-theme="dark"] .step-active { background: #F9F8F2 !important; color: #272727 !important; }
body[data-theme="dark"] .step-done { background: #F9F8F2 !important; color: #272727 !important; }
body[data-theme="dark"] .step-pending { background: #333 !important; color: rgba(249,248,242,0.3) !important; }
body[data-theme="dark"] .time-slot:hover, body[data-theme="dark"] .time-slot.selected { background: rgba(249,248,242,0.1) !important; border-color: #F9F8F2 !important; color: #F9F8F2 !important; }
body[data-theme="dark"] .cal-day:hover, body[data-theme="dark"] .cal-day.selected { background: #F9F8F2 !important; color: #272727 !important; }
body[data-theme="dark"] .cal-day.today { border-color: #F9F8F2 !important; }

/* ZarinPal gateway - keep mostly light for realism but adapt surrounding */
body[data-theme="dark"] .bg-gray-50 { background-color: #f5f5f5 !important; }
body[data-theme="dark"] .bg-gray-100 { background-color: #eee !important; }
body[data-theme="dark"] .bg-white { background-color: #2a2a2a !important; }
body[data-theme="dark"] .text-gray-900 { color: #F9F8F2 !important; }
body[data-theme="dark"] .text-gray-800 { color: #e0e0e0 !important; }
body[data-theme="dark"] .text-gray-700 { color: #ccc !important; }
body[data-theme="dark"] .text-gray-600 { color: #bbb !important; }
body[data-theme="dark"] .text-gray-500 { color: #aaa !important; }
body[data-theme="dark"] .text-gray-400 { color: #999 !important; }
body[data-theme="dark"] .border-gray-200 { border-color: #555 !important; }
body[data-theme="dark"] .bg-gray-50, body[data-theme="dark"] .bg-gray-100 { background-color: #3a3a3a !important; color: #F9F8F2 !important; }

/* Gold text (accent) */
body[data-theme="dark"] .gold-text { color: #c2455a !important; }

/* Modal overlay for admin-services */
body[data-theme="dark"] .modal-content { background: #2a2a2a !important; }

/* Input fields */
body[data-theme="dark"] input, body[data-theme="dark"] textarea, body[data-theme="dark"] select {
  background-color: #333 !important;
  color: #F9F8F2 !important;
  border-color: rgba(249,248,242,0.12) !important;
}
body[data-theme="dark"] input::placeholder, body[data-theme="dark"] textarea::placeholder {
  color: rgba(249,248,242,0.3) !important;
}

/* Admin nav - active pill override */
body[data-theme="dark"] .bg-primary.text-\[\#F9F8F2\] { background-color: #F9F8F2 !important; color: #272727 !important; }

/* Fix: header, sticky bars, bottom CTAs */
body[data-theme="dark"] .bg-base\/90 { background-color: rgba(30,30,30,0.9) !important; }


/* Theme toggle pill */
body[data-theme="dark"] .theme-toggle-btn { background-color: #F9F8F2 !important; color: #272727 !important; border-color: #F9F8F2 !important; }
/* Remove all shadows from images */
img { box-shadow: none !important; }
</style>


<!-- Header -->
<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <a href="services.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center">
      <i data-lucide="arrow-right" class="w-4 h-4 text-[#272727]/60"></i>
    </a>
    <h1 class="text-[#272727] font-bold text-lg">رزرو نوبت</h1>
  </div>
</header>

<!-- Progress Steps -->
<div class="max-w-md mx-auto px-6 py-4">
  <div class="flex items-center justify-between relative">
    <div class="absolute top-4 right-6 left-6 h-0.5 bg-surface-light"></div>
    <div class="relative z-10 flex flex-col items-center gap-1">
      <div class="w-8 h-8 rounded-full step-active flex items-center justify-center text-xs font-bold">۱</div>
      <span class="text-primary text-[10px] font-medium">خدمت</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-1">
      <div class="w-8 h-8 rounded-full step-pending flex items-center justify-center text-xs font-bold" id="step2">۲</div>
      <span class="text-[#272727]/30 text-[10px]" id="step2label">تاریخ</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-1">
      <div class="w-8 h-8 rounded-full step-pending flex items-center justify-center text-xs font-bold" id="step3">۳</div>
      <span class="text-[#272727]/30 text-[10px]" id="step3label">ساعت</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-1">
      <div class="w-8 h-8 rounded-full step-pending flex items-center justify-center text-xs font-bold" id="step4">۴</div>
      <span class="text-[#272727]/30 text-[10px]" id="step4label">تأیید</span>
    </div>
  </div>
</div>

<!-- Step 1: Service Selection (pre-filled) -->
<div id="stepService" class="max-w-md mx-auto px-4">
  <h2 class="text-[#272727] font-bold text-sm mb-3">انتخاب خدمت</h2>
  <div id="serviceList" class="space-y-2 mb-6"></div>
</div>

<!-- Step 2: Date Selection (Jalali Calendar) -->
<div id="stepDate" class="max-w-md mx-auto px-4 mt-4">
  <h2 class="text-[#272727] font-bold text-sm mb-3">انتخاب تاریخ</h2>
  
  <div class="bg-surface rounded-2xl border border-[#272727]/5 p-4">
    <!-- Month Header -->
    <div class="flex items-center justify-between mb-4">
      <button id="calPrev" class="w-8 h-8 rounded-full bg-surface-light flex items-center justify-center">
        <i data-lucide="chevron-right" class="w-4 h-4 text-[#272727]/60"></i>
      </button>
      <h3 id="calTitle" class="text-[#272727] font-bold text-sm">…</h3>
      <button id="calNext" class="w-8 h-8 rounded-full bg-surface-light flex items-center justify-center">
        <i data-lucide="chevron-left" class="w-4 h-4 text-[#272727]/60"></i>
      </button>
    </div>
    
    <!-- Day names -->
    <div class="grid grid-cols-7 gap-1 mb-2">
      <div class="text-center text-[#272727]/30 text-[10px] py-1">ش</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">ی</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">د</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">س</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">چ</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">پ</div>
      <div class="text-center text-[#272727]/30 text-[10px] py-1">ج</div>
    </div>
    
    <!-- Calendar Grid -->
    <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
</div>
  </div>
  
  <div class="bg-surface-light/50 rounded-xl p-3 mt-3 flex items-center gap-2">
    <i data-lucide="calendar-check" class="w-4 h-4 text-primary shrink-0"></i>
    <p class="text-[#272727]/60 text-xs">تاریخ انتخابی: <span id="selDateText" class="text-[#272727] font-semibold">هنوز تاریخی انتخاب نشده</span></p>
  </div>
</div>

<!-- Step 3: Time Selection -->
<div id="stepTime" class="max-w-md mx-auto px-4 mt-6">
  <h2 class="text-[#272727] font-bold text-sm mb-3">انتخاب ساعت</h2>
  
  <div id="timeGrid" class="grid grid-cols-3 gap-2 mb-4"></div>
  </div>
  
  <div class="flex items-center gap-4 text-[10px] text-[#272727]/30 mb-4">
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-primary inline-block"></span> انتخاب‌شده</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-surface-lighter inline-block"></span> آزاد</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-surface-light/50 inline-block"></span> رزرو شده</span>
  </div>
</div>

<!-- Booking Summary Bar -->
<div class="max-w-md mx-auto px-4 mt-4 mb-28">
  <div class="bg-surface rounded-2xl border border-primary/15 p-4">
    <h3 class="text-[#272727] font-bold text-sm mb-3">خلاصه رزرو</h3>
    <div class="space-y-2 text-xs">
      <div class="flex items-center justify-between">
        <span class="text-[#272727]/40">خدمت</span>
        <span id="sumService" class="text-[#272727] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#272727]/40">تاریخ</span>
        <span id="sumDate" class="text-[#272727] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#272727]/40">ساعت</span>
        <span id="sumTime" class="text-[#272727] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#272727]/40">مدت</span>
        <span id="sumDuration" class="text-[#272727] font-medium">—</span>
      </div>
      <div class="border-t border-[#272727]/5 pt-2 flex items-center justify-between">
        <span class="text-[#272727]/60 font-medium">مبلغ قابل پرداخت</span>
        <span id="sumPrice" class="text-primary font-bold text-base">—</span>
      </div>
    </div>
  </div>
</div>

<!-- Sticky Continue Button -->
<div class="fixed bottom-4 left-0 right-0 z-40 px-4">
  <div class="max-w-md mx-auto">
    <button id="ctaBtn" disabled class="flex items-center justify-center gap-2 w-full bg-gradient-to-l from-primary to-primary-dark text-[#F9F8F2] font-bold py-4 rounded-2xl shadow-lg shadow-[#272727]/25 disabled:cursor-not-allowed">
      تأیید و پرداخت
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </button>
  </div>
</div>



</body>

<script src="assets/page-booking.js"></script>
