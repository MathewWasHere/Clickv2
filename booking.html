<style type="text/tailwindcss">
@theme {
  --color-primary: #111111;
  --color-primary-dark: #000000;
  --color-accent: #6B7280;
  --color-surface: #FFFFFF;
  --color-surface-light: #F3F4F6;
  --color-surface-lighter: #E5E7EB;
  --color-base: #ECEEF0;
  --color-on-primary: #FFFFFF;
  --font-family-vazir: 'Vazirmatn', sans-serif;
}
</style>
<style>
* { font-family: 'Vazirmatn', sans-serif; }
body { background: #ECEEF0; margin: 0; }
.step-active { background: #111111; color: #FFFFFF; }
.step-done { background: #111111; color: #FFFFFF; }
.step-pending { background: #F3F4F6; color: rgba(21,22,24,0.3); }
.time-slot { transition: all 0.15s; }
.time-slot:hover, .time-slot.selected { background: rgba(21,22,24,0.08); border-color: #111111; color: #111111; }
.time-slot.disabled { opacity: 0.3; pointer-events: none; }
.cal-day { transition: all 0.15s; cursor: pointer; }
.cal-day:hover, .cal-day.selected { background: #111111; color: #FFFFFF; }
.cal-day.disabled { opacity: 0.25; pointer-events: none; }
.cal-day.today { border: 1px solid #111111; }
.stage { animation: stageIn .25s ease; }
@keyframes stageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .stage { animation: none; }
  .time-slot, .cal-day { transition: none; }
}
.step-dot { transition: background .2s, color .2s; cursor: pointer; }
</style>


<style>img { box-shadow: none !important; }</style>


<!-- Header -->
<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <a href="services.html" class="w-9 h-9 rounded-full bg-surface-light flex items-center justify-center">
      <i data-lucide="arrow-right" class="w-4 h-4 text-[#111111]/60"></i>
    </a>
    <h1 class="text-[#111111] font-bold text-lg">رزرو نوبت</h1>
  </div>
</header>

<!-- Progress Steps (tap a completed step to go back) -->
<div class="max-w-md mx-auto px-6 py-2.5">
  <div class="flex items-center justify-between relative">
    <div class="absolute top-3 right-5 left-5 h-0.5 bg-surface-light"></div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap1" role="button">
      <div class="w-6 h-6 rounded-full step-active flex items-center justify-center text-[10px] font-bold" id="stepDot1">۱</div>
      <span class="text-primary text-[9px] font-medium" id="stepLabel1">خدمت</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap2">
      <div class="w-6 h-6 rounded-full step-pending flex items-center justify-center text-[10px] font-bold" id="stepDot2">۲</div>
      <span class="text-[#111111]/30 text-[9px]" id="stepLabel2">تاریخ</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap3">
      <div class="w-6 h-6 rounded-full step-pending flex items-center justify-center text-[10px] font-bold" id="stepDot3">۳</div>
      <span class="text-[#111111]/30 text-[9px]" id="stepLabel3">ساعت</span>
    </div>
  </div>
</div>

<!-- Step 1: Service Selection (pre-filled) -->
<div id="stepService" class="max-w-md mx-auto px-4 mb-20">
  <h2 class="text-[#111111] text-xs font-bold mb-2">انتخاب خدمت</h2>
  <div id="serviceList" class="grid grid-cols-2 gap-2"></div>
</div>

<!-- Step 2: Date Selection (next 10 days) -->
<div id="stepDate" class="max-w-md mx-auto px-4 mt-3 mb-20">
  <div class="flex items-center justify-between mb-2">
    <h2 class="text-[#111111] text-xs font-bold">انتخاب تاریخ</h2>
    <span class="text-[#111111]/40 text-[10px]">۱۰ روز آینده</span>
  </div>

  <div class="bg-surface rounded-2xl border border-[#111111]/5 p-3">
    <div id="dayScroller" class="grid grid-cols-6 gap-1.5"></div>
  </div>
</div>

<!-- Step 3: Time Selection -->
<div id="stepTime" class="max-w-md mx-auto px-4 mt-3">
  <h2 class="text-[#111111] text-xs font-bold mb-2">انتخاب ساعت</h2>

  <div id="timeGrid" class="grid grid-cols-4 gap-1.5 mb-2"></div>

  <div class="flex items-center gap-3 text-[9px] text-[#111111]/30 mb-3">
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-primary inline-block"></span> انتخاب‌شده</span>
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-surface-lighter inline-block"></span> آزاد</span>
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-surface-light/50 inline-block"></span> رزرو شده</span>
  </div>

  <div class="bg-surface rounded-2xl border border-primary/15 p-3 mb-20">
    <h3 class="text-[#111111] text-xs font-bold mb-1.5">خلاصه رزرو</h3>
    <div class="space-y-1 text-[10px]">
      <div class="flex items-center justify-between">
        <span class="text-[#111111]/40">خدمت</span>
        <span id="sumService" class="text-[#111111] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#111111]/40">تاریخ</span>
        <span id="sumDate" class="text-[#111111] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#111111]/40">ساعت</span>
        <span id="sumTime" class="text-[#111111] font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#111111]/40">مدت</span>
        <span id="sumDuration" class="text-[#111111] font-medium">—</span>
      </div>
      <div class="border-t border-primary/10 pt-1 flex items-center justify-between">
        <span class="text-[#111111]/60 font-medium">مبلغ قابل پرداخت</span>
        <span id="sumPrice" class="text-primary font-bold text-xs">—</span>
      </div>
    </div>
  </div>
</div>
<!-- Sticky Action Bar --><!-- Sticky Action Bar -->
<div class="fixed bottom-4 left-0 right-0 z-40 px-4">
  <div class="island max-w-md mx-auto p-2.5 flex items-center gap-2">
    <button id="backBtn" class="hidden shrink-0 w-10 h-10 rounded-xl bg-surface-light items-center justify-center" aria-label="مرحله قبل">
      <i data-lucide="arrow-right" class="w-4 h-4 text-[#111111]/60"></i>
    </button>
    <button id="ctaBtn" class="flex-1 flex items-center justify-center gap-2 bg-primary text-on-primary font-bold text-sm py-3 rounded-xl shadow-lg shadow-[#111111]/25">
      <span id="ctaLabel">ادامه</span>
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </button>
  </div>
</div>
