<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101315">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  <!-- Pre-paint theme bootstrap: sets the stored mode before the first frame.
       Keep inline and in sync with assets/theme.js (KEY = 'pirayesh-theme'). -->
  <script>(function(d){var m;try{m=localStorage.getItem('pirayesh-theme')}catch(e){}d.documentElement.setAttribute('data-theme',m==='light'?'light':'dark')})(document)</script>
  <link rel="stylesheet" href="assets/theme.css">
  <style type="text/tailwindcss">
/* Semantic roles -> Tailwind utilities. Every value is a CSS variable defined in
   assets/theme.css, so each utility flips with the mode on its own.
   NOTE: no --color-base here on purpose -- it collided with Tailwind's own
   `text-base` font-size utility and made text vanish in dark mode. */
@theme inline {
  --color-bg: var(--bg);
  --color-surface: var(--surface);
  --color-surface-2: var(--surface-2);
  --color-surface-3: var(--surface-3);
  --color-fg: var(--fg);
  --color-muted: var(--muted);
  --color-faint: var(--faint);
  --color-line: var(--line);
  --color-line-strong: var(--line-strong);
  --color-primary: var(--primary);
  --color-primary-dark: var(--primary-dark);
  --color-primary-tint: var(--primary-tint);
  --color-on-primary: var(--on-primary);
  --color-veil: var(--veil);
  --color-veil-2: var(--veil-2);
  --color-on-veil: var(--on-veil);
  --color-on-veil-accent: var(--on-veil-accent);
  --color-accent: var(--accent);
  --color-ok: var(--ok);
  --color-warn: var(--warn);
  --color-err: var(--err);
  --color-info: var(--info);
  --color-violet: var(--violet);
  --font-family-vazir: 'Vazirmatn', sans-serif;
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/@fortawesome/fontawesome-free@6.7.2/js/all.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body dir="rtl" lang="fa">

<!-- Header -->
<header class="sticky top-2 z-40 px-3">
  <div class="island max-w-md mx-auto px-4 py-3 flex items-center gap-3">
    <a href="services.html" class="icon-btn w-9 h-9 flex items-center justify-center">
      <i data-lucide="arrow-right" class="w-4 h-4 text-fg/75"></i>
    </a>
    <h1 class="text-fg font-bold text-lg">رزرو نوبت</h1>
  </div>
</header>

<!-- Progress Steps (tap a completed step to go back) -->
<div class="max-w-md mx-auto px-6 py-2.5">
  <div class="flex items-center justify-between relative">
    <div class="absolute top-3 right-5 left-5 h-0.5 bg-surface-3"></div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap1" role="button">
      <div class="w-6 h-6 rounded-full step-active flex items-center justify-center text-[10px] font-bold" id="stepDot1">۱</div>
      <span class="text-primary text-[9px] font-medium" id="stepLabel1">خدمت</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap2">
      <div class="w-6 h-6 rounded-full step-pending flex items-center justify-center text-[10px] font-bold" id="stepDot2">۲</div>
      <span class="text-faint text-[9px]" id="stepLabel2">تاریخ</span>
    </div>
    <div class="relative z-10 flex flex-col items-center gap-0.5" id="stepWrap3">
      <div class="w-6 h-6 rounded-full step-pending flex items-center justify-center text-[10px] font-bold" id="stepDot3">۳</div>
      <span class="text-faint text-[9px]" id="stepLabel3">ساعت</span>
    </div>
  </div>
</div>

<!-- Step 1: Service Selection (pre-filled) -->
<div id="stepService" class="max-w-md mx-auto px-4 mb-20">
  <h2 class="text-fg text-xs font-bold mb-2">انتخاب خدمت</h2>
  <div id="serviceList" class="grid grid-cols-2 gap-2"></div>
</div>

<!-- Step 2: Date Selection (Jalali Calendar) -->
<div id="stepDate" class="max-w-md mx-auto px-4 mt-3 mb-20">
  <h2 class="text-fg text-xs font-bold mb-2">انتخاب تاریخ</h2>

  <div class="bg-surface rounded-2xl border border-line p-3 elev">
    <div class="flex items-center justify-between mb-2.5">
      <button id="calPrev" class="icon-btn w-7 h-7 flex items-center justify-center">
        <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-fg/75"></i>
      </button>
      <h3 id="calTitle" class="text-fg font-bold text-xs">…</h3>
      <button id="calNext" class="icon-btn w-7 h-7 flex items-center justify-center">
        <i data-lucide="chevron-left" class="w-3.5 h-3.5 text-fg/75"></i>
      </button>
    </div>

    <div class="grid grid-cols-7 gap-1 mb-1">
      <div class="text-center text-faint text-[9px] py-0.5">ش</div>
      <div class="text-center text-faint text-[9px] py-0.5">ی</div>
      <div class="text-center text-faint text-[9px] py-0.5">د</div>
      <div class="text-center text-faint text-[9px] py-0.5">س</div>
      <div class="text-center text-faint text-[9px] py-0.5">چ</div>
      <div class="text-center text-faint text-[9px] py-0.5">پ</div>
      <div class="text-center text-faint text-[9px] py-0.5">ج</div>
    </div>

    <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
  </div>
</div>

<!-- Step 3: Time Selection -->
<div id="stepTime" class="max-w-md mx-auto px-4 mt-3">
  <h2 class="text-fg text-xs font-bold mb-2">انتخاب ساعت</h2>

  <div id="timeGrid" class="grid grid-cols-4 gap-1.5 mb-2"></div>

  <div class="flex items-center gap-3 text-[9px] text-faint mb-3">
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-primary inline-block"></span> انتخاب‌شده</span>
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-surface ring-1 ring-line inline-block"></span> آزاد</span>
    <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-fg/10 inline-block"></span> رزرو شده</span>
  </div>

  <div class="bg-surface rounded-2xl border border-primary/15 p-3 mb-20">
    <h3 class="text-fg text-xs font-bold mb-1.5">خلاصه رزرو</h3>
    <div class="space-y-1 text-[10px]">
      <div class="flex items-center justify-between">
        <span class="text-muted">خدمت</span>
        <span id="sumService" class="text-fg font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted">تاریخ</span>
        <span id="sumDate" class="text-fg font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted">ساعت</span>
        <span id="sumTime" class="text-fg font-medium">—</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-muted">مدت</span>
        <span id="sumDuration" class="text-fg font-medium">—</span>
      </div>
      <div class="border-t border-primary/10 pt-1 flex items-center justify-between">
        <span class="text-fg/75 font-medium">مبلغ قابل پرداخت</span>
        <span id="sumPrice" class="text-primary font-bold text-xs">—</span>
      </div>
    </div>
  </div>
</div>
<!-- Sticky Action Bar --><!-- Sticky Action Bar -->
<div class="fixed bottom-4 left-0 right-0 z-40 px-4">
  <div class="island max-w-md mx-auto p-2.5 flex items-center gap-2">
    <button id="backBtn" class="hidden shrink-0 w-10 h-10 rounded-xl bg-surface-3 items-center justify-center" aria-label="مرحله قبل">
      <i data-lucide="arrow-right" class="w-4 h-4 text-fg/75"></i>
    </button>
    <button id="ctaBtn" class="flex-1 flex items-center justify-center gap-2 bg-gradient-to-l from-primary to-primary-dark text-on-primary font-bold text-sm py-3 rounded-xl elev-cta">
      <span id="ctaLabel">ادامه</span>
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </button>
  </div>
</div>

</body>
<script src="assets/data.js"></script>
<script src="assets/page-booking.js"></script>
<script src="assets/theme.js"></script>
<script src="assets/pwa.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</html>
