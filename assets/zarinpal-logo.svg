<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- Yellow parallelogram / slanted rectangle with rounded corners -->
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#F0B400"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A36FA"/>
      <stop offset="100%" stop-color="#0A1FB8"/>
    </linearGradient>
  </defs>
  <!-- Yellow slanted square (rounded) -->
  <path d="M 205 130
           L 505 110
           Q 532 108 540 135
           L 410 505
           Q 401 528 375 527
           L 75 540
           Q 48 541 40 514
           L 172 146
           Q 181 128 205 130 Z"
        fill="url(#yellowGrad)"/>
  <!-- Blue circle overlapping -->
  <circle cx="220" cy="260" r="150" fill="url(#blueGrad)"/>
  <!-- Subtle shadow/divide on circle -->
  <path d="M 220 110
           A 150 150 0 0 1 220 410
           A 150 150 0 0 0 315 300
           A 150 150 0 0 0 220 110 Z"
        fill="#000" opacity="0.12"/>
</svg>
